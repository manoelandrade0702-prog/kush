  <rect x="0" y="833.3" width="1500" height="27.88" fill="#77c043" fill-opacity="0.8" transform="rotate(-1 750 833.3)"/>
  <rect width="1500" height="1000" filter="url(#grain)" fill="#f1ece3" fill-opacity="0.5"/>
  <rect x="8" y="8" width="1484" height="984" fill="none" stroke="#f1ece3" stroke-opacity="0.12" stroke-width="2"/>
