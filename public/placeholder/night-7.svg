  <rect width="1500" height="1000" fill="url(#bg)"/>
  <rect width="1500" height="1000" fill="url(#blob)"/>
  <g font-family="Archivo, Arial, sans-serif" font-weight="800" fill="#f1ece3" fill-opacity="0.05">
    <text x="321.48" y="794.44" font-size="1333.12" transform="rotate(-1 321.48 794.44)">KH</text>
