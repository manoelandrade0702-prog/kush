    <radialGradient id="blob" cx="13.45%" cy="51.52%" r="58.25%">
      <stop offset="0" stop-color="#77c043" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#77c043" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
