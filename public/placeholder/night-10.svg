<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(294 0.5 0.5)">
      <stop offset="0" stop-color="#09090a"/>
      <stop offset="0.55" stop-color="#14141a"/>
      <stop offset="1" stop-color="#09090a"/>
