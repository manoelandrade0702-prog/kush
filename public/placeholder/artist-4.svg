      <stop offset="0" stop-color="#09090a"/>
      <stop offset="0.55" stop-color="#14141a"/>
      <stop offset="1" stop-color="#09090a"/>
    </linearGradient>
    <radialGradient id="blob" cx="30.23%" cy="36.3%" r="47.91%">
      <stop offset="0" stop-color="#77c043" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#77c043" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
